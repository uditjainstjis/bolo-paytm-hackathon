<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>Paytm · Bolo concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=161805">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="backbtn" data-go="home" aria-label="Back"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="avatar" data-go="profile">UJ</button>
    <div class="brand"><div class="promo">Pay using Paytm <span class="concept">concept demo</span></div><div class="promo2">Win 1g Gold every hour <span class="redarrow">›</span></div></div>
    <div id="title"></div>
    <div class="top-icons"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg><span class="helplink" data-go="help">Help</span></div>
  </header>
  <main id="screen"></main>
  <button id="scanqr" data-go="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2z"/></svg> Scan QR</button>

  <div id="saathi">
    <div id="bubble" hidden>
      <button id="bclose" type="button" aria-label="Close">×</button>
      <div id="heard"></div>
      <div id="said"></div>
      <button id="kbd" type="button">⌨ Type instead</button>
      <form id="typed" hidden><input id="typein" placeholder="Type to Bolo…" autocomplete="off"><button>➤</button></form>
    </div>
    <button id="mascot" aria-label="Talk to Bolo">
      <svg viewBox="0 0 100 100" class="bolo">
        <defs><radialGradient id="g" cx="35%" cy="30%"><stop offset="0" stop-color="#7FE0FF"/><stop offset=".55" stop-color="#00BAF2"/><stop offset="1" stop-color="#0077B6"/></radialGradient></defs>
        <line x1="50" y1="14" x2="50" y2="4" stroke="#002E6E" stroke-width="3" stroke-linecap="round"/>
        <circle class="spark" cx="50" cy="4" r="4" fill="#FFD23F"/>
        <path class="body" d="M50 14c22 0 38 15 38 38 0 24-16 40-38 40S12 76 12 52c0-23 16-38 38-38z" fill="url(#g)"/>
        <ellipse cx="28" cy="60" rx="6" ry="4" fill="#FF8FB1" opacity=".55"/><ellipse cx="72" cy="60" rx="6" ry="4" fill="#FF8FB1" opacity=".55"/>
        <g class="eyes"><ellipse cx="37" cy="47" rx="9" ry="11" fill="#fff"/><ellipse cx="63" cy="47" rx="9" ry="11" fill="#fff"/>
          <g class="pupils"><circle cx="38" cy="49" r="5" fill="#002E6E"/><circle cx="64" cy="49" r="5" fill="#002E6E"/><circle cx="40" cy="46" r="1.6" fill="#fff"/><circle cx="66" cy="46" r="1.6" fill="#fff"/></g></g>
        <path class="mouth" d="M40 66 Q50 75 60 66" stroke="#002E6E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div id="confirm" hidden>
    <div class="sheet">
      <div class="ctitle">Bolo wants to</div>
      <div id="cwhat"></div>
      <div class="cbtns"><button id="cno">No</button><button id="cyes">Yes, do it</button></div>
    </div>
  </div>
  <div id="pin" hidden>
    <div class="sheet">
      <div class="ctitle">Type PIN (demo)</div>
      <div id="pinwhat"></div>
      <div id="pad"></div>
      
    </div>
  </div>
  <button id="logbtn" title="Action log">⚙</button>
  <div id="log" hidden></div>
</div>
<script src="app.js?v=161805"></script>
</body>
</html>
